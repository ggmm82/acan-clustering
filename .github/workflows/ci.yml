name: ACAN verify and release
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  workflow:
    name: Workflow lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate Actions syntax and expressions
        run: |
          docker run --rm --mount "type=bind,src=$PWD,dst=/repo,readonly" -w /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            .github/workflows/ci.yml
  resolve:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      reuse: ${{ steps.reuse.outputs.reuse }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: reuse
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release_pipeline.py resolve --directory reports/reuse
      - uses: actions/upload-artifact@v4
        if: steps.reuse.outputs.reuse == 'true'
        with:
          name: reusable-runtime
          path: reports/reuse/
          retention-days: 30
  tests:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev,ui]'
      - run: python -m unittest discover -s tests -v
      - run: python -m pip check
      - name: Build Python distribution
        run: python -m pip wheel --no-deps --wheel-dir dist .
  docker:
    name: Docker runtime
    needs: [resolve, tests]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        if: needs.resolve.outputs.reuse == 'true'
        with:
          name: reusable-runtime
          path: reports/runtime
      - uses: docker/build-push-action@v6
        if: needs.resolve.outputs.reuse != 'true'
        with:
          context: .
          load: true
          tags: acan-candidate:test
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=acan
          cache-to: type=gha,mode=max,scope=acan
      - name: Select the exact candidate
        id: candidate
        env:
          REUSE: ${{ needs.resolve.outputs.reuse }}
        run: |
          if [ "$REUSE" = true ]; then
            image=$(python scripts/release_pipeline.py validate)
            docker pull "$image"
          else
            image=acan-candidate:test
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - name: Test the installed package in the actual image
        env:
          IMAGE: ${{ steps.candidate.outputs.image }}
        run: |
          docker run --rm --network=none --entrypoint python \
            --mount "type=bind,src=$PWD/tests,dst=/tests,readonly" \
            --mount "type=bind,src=$PWD/scripts,dst=/app/scripts,readonly" \
            --mount "type=bind,src=$PWD/config,dst=/app/config,readonly" \
            "$IMAGE" -m unittest discover -s /tests -v
          docker run --rm --network=none --entrypoint python "$IMAGE" -m pip check
      - name: Start a constrained container and exercise HTTP inference
        env:
          IMAGE: ${{ steps.candidate.outputs.image }}
        run: |
          docker run -d --name acan-smoke -p 127.0.0.1:4000:4000 \
            --read-only --tmpfs /tmp:size=256m,mode=1777 \
            --mount "type=bind,src=$PWD/scripts/smoke.py,dst=/smoke.py,readonly" \
            --cap-drop ALL --security-opt no-new-privileges "$IMAGE"
          docker exec acan-smoke python -c 'import os; assert os.getuid() == 10001'
          docker exec acan-smoke python /smoke.py
          docker compose config --quiet
      - name: Publish and seal the tested candidate
        if: needs.resolve.outputs.reuse != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          image="ghcr.io/${REPOSITORY,,}:candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker tag acan-candidate:test "$image"
          docker push "$image"
          digest=$(docker image inspect "$image" --format '{{index .RepoDigests 0}}')
          python scripts/release_pipeline.py seal --image "$digest"
      - name: Validate the sealed deployment Compose
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          TRAEFIK_HOST: ci.hstgr.cloud
        run: |
          python scripts/release_pipeline.py validate
          docker compose -f reports/runtime/compose.release.yaml config --quiet
          docker compose -f reports/runtime/compose.hostinger.yaml config --quiet
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          name: verified-runtime
          path: reports/runtime/
          retention-days: 30
      - name: Container logs
        if: failure()
        run: docker logs acan-smoke || true
      - name: Cleanup
        if: always()
        run: docker rm -f acan-smoke || true
  gate:
    name: CI gate
    if: always()
    needs: [workflow, resolve, tests, docker]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all checks to have succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          assert all(job['result'] == 'success' for job in results.values()), results
          PY
  release:
    name: Publish verified release
    needs: gate
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    environment: ${{ github.event_name == 'pull_request' && 'preview' || 'release' }}
    concurrency:
      group: release-publisher
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: verified-runtime
          path: reports/runtime
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified preview or stable release without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release_pipeline.py publish
