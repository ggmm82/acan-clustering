[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acan-clustering"
version = "8.6.0"
description = "Algebraic Concept Attention Network (ACAN): White-Box Differentiable Concept Discovery and Universal Tabular Autocompletion"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
keywords = [
    "explainable-ai",
    "slot-attention",
    "conceptual-clustering",
    "tabular-learning",
    "masked-tabular-modeling",
    "relational-algebra",
    "pytorch"
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
torch = ["torch>=2.0.0", "tensorboard>=2.14.0"]
docker = ["gunicorn>=23.0.0", "setuptools>=77.0.0", "wheel"]
ui = ["dash>=2.16.0", "dash-cytoscape>=0.3.0", "dash-bootstrap-components>=1.5.0", "dash-daq>=0.5.0", "plotly>=5.18.0", "matplotlib>=3.7.0", "scikit-learn>=1.3.0", "xgboost-cpu>=3.0,<4", "catboost>=1.2,<2", "pyarrow>=12.0.0", "openpyxl>=3.1.0"]
llm = ["torch==2.15.0", "transformers==4.57.6", "peft==0.18.0", "safetensors==0.8.0", "waitress==3.0.2", "flask>=3.0,<4", "threadpoolctl>=3.0", "pyarrow==26.0.1", "pypdf==6.21.4"]
dev = ["pytest>=7.4.0", "matplotlib>=3.7.0", "seaborn>=0.13.0"]

[tool.setuptools.packages.find]
include = ["acan", "acan.*"]
namespaces = false

[tool.setuptools.package-data]
"acan.vis" = ["assets/*.js", "assets/*.css"]
"acan" = ["export_template/*.tmpl"]
"acan.lm" = ["dialogue_sources.json"]
