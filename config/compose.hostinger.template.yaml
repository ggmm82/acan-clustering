# Internal template. Deploy the sealed compose.hostinger.yaml from a release.
name: ${ACAN_PROJECT_NAME:-acan}
services:
  acan:
    image: __ACAN_IMAGE__
    init: true
    restart: unless-stopped
    mem_limit: 1024m
    cpus: 2
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      ACAN_COOKIE_SECURE: 'true'
    labels:
      - traefik.enable=true
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}-acan.rule=Host(`${COMPOSE_PROJECT_NAME}.${TRAEFIK_HOST:?Set TRAEFIK_HOST}`)
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}-acan.entrypoints=websecure
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}-acan.tls=true
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}-acan.tls.certresolver=letsencrypt
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}-acan.service=${COMPOSE_PROJECT_NAME}-acan
      - traefik.http.services.${COMPOSE_PROJECT_NAME}-acan.loadbalancer.server.port=4000
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}-acan.middlewares=${COMPOSE_PROJECT_NAME}-acan-auth
      - traefik.http.middlewares.${COMPOSE_PROJECT_NAME}-acan-auth.basicauth.users=${ACAN_BASIC_AUTH_USERS:?Set ACAN_BASIC_AUTH_USERS to a htpasswd bcrypt entry}
      - traefik.http.middlewares.${COMPOSE_PROJECT_NAME}-acan-auth.basicauth.removeheader=true
